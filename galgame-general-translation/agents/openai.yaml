interface:
  display_name: "galgame通用翻译skill"
  short_description: "分批自审与一次整线纠错，同线单名额轮换、统一术语与上下文恢复，不反复终审"
  default_prompt: "使用 $galgame-general-translation 翻译并校订当前 Galgame 项目；仅在我授权时使用子代理。分批翻译后自审，整线完成后做一次四类纠错，原译者修正并局部自检，不另开审核轮次。同线最多一个未释放子代理；先释放译者，审核完整交卷并关闭释放后再恢复原译者修正；交付译文、术语表和真实检查报告。"
policy:
  allow_implicit_invocation: true
